# Production load balancer (nginx). One entry point on port 80:
#   api.<domain>/api/*        -> API replicas        (least connections, passive failover)
#   api.<domain>/socket.io/*  -> realtime replicas   (WebSocket, pinned per ride id so a ride's driver and rider meet on one replica)
#   admin.<domain> / app.<domain> / driver.<domain> -> the three web apps
# Locally the *.localhost names resolve to 127.0.0.1 in modern browsers.
upstream api {
  least_conn;
  server api1:4000 max_fails=2 fail_timeout=10s;
  server api2:4000 max_fails=2 fail_timeout=10s;
}
upstream realtime {
  hash $arg_rideId consistent;
  server realtime1:4100 max_fails=2 fail_timeout=10s;
  server realtime2:4100 max_fails=2 fail_timeout=10s;
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name api.localhost;
  location /api/ {
    proxy_pass http://api;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /socket.io/ {
    proxy_pass http://realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
}
server { listen 80; server_name admin.localhost;  location / { proxy_pass http://admin;  proxy_set_header Host $host; } }
server { listen 80; server_name app.localhost;    location / { proxy_pass http://rider;  proxy_set_header Host $host; } }
server { listen 80; server_name driver.localhost; location / { proxy_pass http://driver; proxy_set_header Host $host; } }
